<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Indispensable sur mobile : la page prend la largeur de l'écran
         (sans cette ligne, le téléphone affiche une page "PC" minuscule). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Super CP</title>
    <meta name="theme-color" content="#ff7a59" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="entete">
      <h1>Super CP</h1>
      <p class="score" aria-live="polite">⭐ <span id="etoiles">0</span></p>
    </header>

    <main>
      <p class="consigne">Choisis une activité !</p>
      <!-- Les tuiles des matières sont ajoutées ici par js/app.js -->
      <nav id="matieres" class="grille" aria-label="Matières"></nav>
      <p id="message" class="message" role="status"></p>
    </main>

    <!-- type="module" : permet d'utiliser import / export dans le navigateur -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
