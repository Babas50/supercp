# Publication de l'appli sur GitHub Pages (hébergement gratuit de GitHub).
# Se lance à chaque modification de la branche main, donc après chaque fusion
# de pull request. Adresse de l'appli : https://babas50.github.io/supercp/

name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch: # ajoute un bouton "Run workflow" pour relancer à la main

# Droits nécessaires pour publier sur GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois. Une publication déjà commencée va jusqu'au bout
# (l'interrompre au milieu peut laisser GitHub Pages dans un état bancal).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. On revérifie le code : on ne publie jamais une version cassée.
  verifier:
    name: Linter et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # 2. On prépare le paquet à publier : le dossier src/ (l'appli), mis de côté
  #    sous le nom "github-pages" (un "artefact" = un fichier produit par un job).
  preparer:
    name: Préparer le paquet
    needs: verifier # attend que la vérification réussisse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

  # 3. On publie ce paquet sur GitHub Pages, dans un job SÉPARÉ.
  #    Pourquoi séparé : juste après l'envoi du paquet, GitHub met quelques secondes
  #    à le "voir". Quand l'envoi et la publication étaient dans le même job,
  #    la publication cherchait le paquet 0,3 seconde après l'envoi, ne le trouvait
  #    pas encore ("No artifacts named github-pages") et échouait.
  #    Le démarrage d'un nouveau job laisse ce délai. C'est aussi le découpage
  #    du modèle officiel de GitHub pour Pages.
  publier:
    name: Publier sur GitHub Pages
    needs: preparer # attend que le paquet soit envoyé
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
